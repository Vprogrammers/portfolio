name: Responsive checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: responsive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      PORT: "8080"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Build Nitro
        run: npm run build
      - name: Run responsive browser checks
        run: npx playwright test --config=tests/playwright/playwright.config.ts tests/playwright/e2e/responsive.spec.ts --project=chromium
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-playwright-results
          path: |
            tests/playwright/test-results/
            public/reports/playwright/
          if-no-files-found: ignore
          retention-days: 7
